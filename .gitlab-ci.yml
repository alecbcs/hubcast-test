stages:
  - build
  - trigger

build-job:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - echo "Running..."
    - sleep 8
    - echo "Finished!"

build-2-job:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - echo "Running..."
    - sleep 5
    - echo "Finished!"

trigger-child-pipeline-1:
  stage: trigger
  trigger:
    include: child-pipeline-1.yml
    strategy: depend

trigger-child-pipeline-2:
  stage: trigger
  trigger:
    include: child-pipeline-2.yml
    strategy: depend
